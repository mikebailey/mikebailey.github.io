        forecast accuracy by over 20%.

  - position: "Research Intern"
    company: "Facebook"
    startDate: "Oct 2011"
    endDate: "Jan 2012"
    resume: false
    highlights:
      - >-
        Investigated competitive externalities of advertising; built an auction
        simulation algorithm to evaluate site-wide impact on key metrics.

  - position: "Research Intern"
    company: "Yahoo!"
    startDate: "Apr 2011"
    endDate: "Oct 2011"
    resume: false
    highlights:
      - >-
        Developed a theoretical and statistical model for targeted advertising
        effectiveness; paper accepted at WWW 2012.

  - position: "Lecturer & Research Assistant"
    company: "Stanford University"
    startDate: "Sep 2007"
    endDate: "Feb 2012"
    resume: false
    highlights:
      - >-
        Taught intermediate economics (2010–2011) with a performance rating of
